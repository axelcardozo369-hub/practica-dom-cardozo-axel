<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria de SuperHeroes</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header class="bg-dark text-white text-center py-4">
      <h1>Galeria de Super Heroes</h1>
    </header>
    <main class="container my-4">
      <div class="mb-4 d-flex gap-2">
        <input
          type="text"
          id="inputFiltro"
          class="form-control"
          placeholder="Buscar por Nombre "
        />
        <button id="btnBoton" class="btn btn-primary">Buscar</button>
      </div>
      <div class="card p-3 mb-4">
        <h2>Agregar nuevo personaje</h2>
        <div class="mb-2">
          <input
            type="text"
            id="inputNombre"
            class="form-control"
            placeholder="Nombre"
          />
        </div>
        <div class="mg-2">
          <input
            type="text"
            id="inputImagen"
            class="form-control"
            placeholder="Introduce URL de imagen"
          />
        </div>
        <button id="btnAgregar" class="btn btn-success">Agregar</button>
      </div>
      <div id="galeria" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
