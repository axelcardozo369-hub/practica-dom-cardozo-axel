<<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de Superhéroes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="bg-dark text-white text-center py-4">
      <h1>Galería de Súper Héroes 🦸</h1>
    </header>

    <main class="container my-4">
      <div class="mb-4">
        <div class="input-group">
          <input
            type="text"
            id="inputFiltro"
            class="form-control"
            placeholder="Buscar por Nombre..."
          />
          <button id="btnFiltrar" class="btn btn-primary" type="button">
            Buscar
          </button>
        </div>
      </div>

      <form id="formAgregar">
        <div class="card p-3 mb-4">
          <h2>Agregar nuevo personaje</h2>
          <div class="mb-2">
            <input
              type="text"
              id="inputNombre"
              class="form-control"
              placeholder="Nombre"
              required
            />
          </div>
          <div class="mb-2">
            <input
              type="url"
              id="inputImagen"
              class="form-control"
              placeholder="Introduce URL de imagen"
              required
            />
          </div>
          <button id="btnAgregar" class="btn btn-success" type="submit">
            Agregar
          </button>
        </div>
      </form>

      <div id="galeria" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4 fw-bold">
      <p>&copy; Página de Súper Héroes 🦸 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
